<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta charset="utf-8" />
<title>Prayer Box · Request</title>
<link rel="stylesheet" href="globals.css">
<link rel="stylesheet" href="prayer.css">
</head>
<body>
<main class="prayer-request-form">
  <form class="submission-card" id="prayer-form">
    <div class="form-fields">
      <div class="div">
        <label class="text-wrapper" for="name">YOUR NAME</label>
        <div class="input-line-container">
          <input class="text-wrapper-2" id="name" name="name" type="text" maxlength="40" placeholder="Lakshman" autocomplete="given-name" />
        </div>
      </div>

      <div class="div">
        <label class="text-wrapper" for="request">PRAYER REQUEST</label>
        <div class="textarea-frame">
          <textarea class="p" id="request" name="request" rows="5" maxlength="2000" required
            placeholder="Please pray for my grandmother who is undergoing surgery tomorrow morning. Praying for peace for our family and a swift, steady recovery."></textarea>
        </div>
      </div>

      <fieldset class="div">
        <legend class="text-wrapper">VISIBILITY SETTING</legend>
        <div class="toggle-track">
          <label class="option-left">
            <input type="radio" name="visibility" value="anonymous" checked />
            <span class="frame">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              <span class="text-wrapper-3">Anonymous Request</span>
            </span>
          </label>
          <label class="option-right">
            <input type="radio" name="visibility" value="public" />
            <span class="frame">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
              <span class="text-wrapper-4">Public Request</span>
            </span>
          </label>
        </div>
      </fieldset>
    </div>

    <div class="form-actions">
      <button class="submit-button" type="submit">
        <span class="text-wrapper-5">Submit Prayer Request</span>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p class="form-error" id="form-error" role="alert" hidden></p>
    </div>
  </form>
  <p class="page-links">
    <a class="back-link" href="index.html">← Back</a>
    <button class="back-link log-out" type="button" id="log-out">Log out</button>
  </p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="db.js"></script>
<script>
  // Only signed-in people can drop a prayer; everyone else goes to the login box first.
  PrayerAuth.currentUser().then(function (user) {
    if (!user) return location.replace('index.html?login');
    var name = document.getElementById('name');
    if (!name.value && user.displayName) name.value = user.displayName.split(' ')[0];
  });
  document.getElementById('log-out').addEventListener('click', function () {
    PrayerAuth.logOutAndGoHome();
  });

  // Save the prayer to the shared box, then go home to watch it drop in.
  document.getElementById('prayer-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var data = new FormData(this);
    var anonymous = data.get('visibility') === 'anonymous';
    var name = String(data.get('name') || '').trim();
    var request = String(data.get('request') || '').trim();
    var error = document.getElementById('form-error');
    var submit = this.querySelector('.submit-button');
    if (!request) return document.getElementById('request').focus();
    error.hidden = true;
    submit.disabled = true;
    PrayerDB.addPrayer({
      name: anonymous || !name ? 'Anonymous' : name,
      request: request,
      visibility: data.get('visibility')
    }).then(function () {
      location.href = 'index.html';
    }, function (err) {
      submit.disabled = false;
      error.textContent = PrayerDB.errorMessage(err);
      error.hidden = false;
    });
  });
</script>
</body>
</html>

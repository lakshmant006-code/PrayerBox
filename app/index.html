<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Prayer Box</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="auth">
          <button type="button" id="googleBtn" class="google-btn">
            <svg class="google-logo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            <span>Sign in with Google</span>
          </button>
          <p class="auth-note" id="authNote" role="status" hidden></p>
        </div>
        <div class="counters" id="counters">0 prayers · 0 answered</div>
      </header>

      <div class="stage-wrap" aria-hidden="true">
        <div class="stage">
          <img class="layer-1" src="/images/1-prayer-box.png" alt="" />
          <img class="layer-2" src="/images/2-opacity.png" alt="" />
          <img class="layer-3" src="/images/3-title.png" alt="" />
          <img class="layer-4" src="/images/4-letter.png" alt="" />
        </div>
      </div>
      <h1 class="visually-hidden">Prayer Box</h1>

      <canvas id="pile"></canvas>

      <div class="compose">
        <button type="button" id="createBtn" class="create-btn">
          Create a new prayer request
        </button>

        <form id="prayerForm" class="prayer-form" hidden>
          <div
            id="typingBox"
            class="typing-box"
            contenteditable="plaintext-only"
            data-placeholder="Lay your prayer down…"
            role="textbox"
            aria-multiline="true"
            aria-label="Write a prayer"
          ></div>
          <div class="form-actions">
            <button type="button" id="cancelBtn" class="cancel-btn">Cancel</button>
            <button type="submit" class="release-btn">Drop it in</button>
          </div>
          <p class="hint">Press Enter to release it.</p>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

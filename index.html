<title>Prayer Box</title>
<style>
  html{ height:100%; }
  body{
    background:#ffffff;
    padding-inline:16px;
    margin:0;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .stage-wrap{
    flex:0 1 auto;
    min-height:0;
    display:flex;
    justify-content:center;
    padding-block:clamp(6px, 2vh, 20px);
  }
  .stage{
    position:relative;
    aspect-ratio:1640/2360;
    height:clamp(120px, 32vh, 320px);
    width:auto;
    max-width:100%;
    background:#ffffff;
  }
  .stage img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  /* layer 1, Prayer box, sits at the base as-is */
  .layer-1{ z-index:1; }
  /* layers 2-4 are multiplied over layer 1 so the shared paper-white
     background of each file doesn't blank out what's underneath it */
  .layer-2{ z-index:2; mix-blend-mode:multiply; }
  .layer-3{ z-index:3; mix-blend-mode:multiply; }
  .layer-4{ z-index:4; mix-blend-mode:multiply; }

  /* ---- write & drop ---- */
  .drop{
    flex:0 0 auto;
    max-width:520px;
    width:100%;
    margin-inline:auto;
    padding-block:4px 12px;
  }
  .drop form{
    display:flex;
    gap:8px;
  }
  .drop input{
    flex:1;
    min-width:0;
    border:none;
    border-bottom:1.5px solid #111;
    background:transparent;
    font-family:inherit;
    font-size:15px;
    padding:8px 2px;
  }
  .drop input:focus{ outline:none; border-bottom-width:2px; }
  .drop button{
    border:1.5px solid #111;
    background:#fff;
    font-family:inherit;
    font-size:13px;
    padding:8px 16px;
    cursor:pointer;
  }
  .drop button:active{ background:#111; color:#fff; }

  /* ---- the pit the letters fall into: fills whatever height is left ---- */
  .ground{
    flex:1 1 auto;
    min-height:0;
    position:relative;
    width:100%;
    overflow:hidden;
    border-top:1.5px solid #111;
  }
  .ground.static{
    overflow:auto;
    display:flex;
    flex-wrap:wrap-reverse;
    align-content:flex-start;
    align-items:flex-end;
    justify-content:flex-start;
    gap:2px;
    padding:14px 8px 0;
  }
  .entry{
    width:64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    pointer-events:none;
  }
  .ground:not(.static) .entry{
    position:absolute;
    left:0;
    top:0;
    will-change:transform;
  }
  .entry img{
    width:40px;
    height:40px;
    display:block;
    transform-origin:50% 50%;
  }
  .entry span{
    display:block;
    max-width:62px;
    margin-top:2px;
    font-size:10px;
    line-height:1.2;
    text-align:center;
    color:#111;
    overflow-wrap:anywhere;
  }
</style>

<div class="stage-wrap">
  <div class="stage">
    <img class="layer-1" src="images/1-prayer-box.png" alt="Prayer box sketch">
    <img class="layer-2" src="images/2-opacity.png" alt="Opacity layer">
    <img class="layer-3" src="images/3-title.png" alt="Prayer Box title">
    <img class="layer-4" src="images/4-letter.png" alt="Letter icon">
  </div>
</div>

<div class="drop">
  <form id="prayerForm">
    <label for="prayerInput" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Write your prayer</label>
    <input id="prayerInput" type="text" maxlength="60" placeholder="write it down" autocomplete="off" required>
    <button type="submit">Drop it in</button>
  </form>
</div>

<div class="ground" id="ground"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function(){
  var STORAGE_KEY = 'prayer-box-entries';
  var ground = document.getElementById('ground');
  var form = document.getElementById('prayerForm');
  var input = document.getElementById('prayerInput');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function save(list){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
  }

  function buildEntryEl(text){
    var el = document.createElement('div');
    el.className = 'entry';
    var img = document.createElement('img');
    img.src = 'images/letter-icon.png';
    img.alt = 'a dropped-in note';
    var span = document.createElement('span');
    span.textContent = text;
    el.appendChild(img);
    el.appendChild(span);
    return { el: el, img: img };
  }

  var stored = load();

  if(reduceMotion || typeof Matter === 'undefined'){
    // no motion (or Matter failed to load): drop entries in place, no simulation
    ground.classList.add('static');
    stored.forEach(function(text){ ground.appendChild(buildEntryEl(text).el); });

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var text = input.value.trim();
      if(!text) return;
      ground.appendChild(buildEntryEl(text).el);
      stored.push(text);
      save(stored);
      input.value = '';
      input.focus();
    });
    return;
  }

  // ---- gravity pit: each note is a tumbling body that falls, collides
  // and settles on the pile, the way jars fall into a jar-app hero ----
  var Engine = Matter.Engine, World = Matter.World, Bodies = Matter.Bodies,
      Body = Matter.Body, Runner = Matter.Runner;

  var engine = Engine.create();
  var world = engine.world;
  var ICON = 40, WALL = 80;
  var bank = []; // { body, el, img }

  var w = ground.clientWidth || 1, h = ground.clientHeight || 1;
  var floor, leftWall, rightWall;

  // the pit's own size settles with layout (flex, safe-area insets, fonts),
  // not only on window resize, so rebuild the bounds directly off its
  // measured size instead of trusting a single clientHeight read at load
  function resizeBounds(){
    var nw = ground.clientWidth, nh = ground.clientHeight;
    if(!nw || !nh) return;
    w = nw; h = nh;
    var next = [
      Bodies.rectangle(w / 2, h + WALL / 2, w + WALL * 2, WALL, { isStatic: true, friction: 0.7 }),
      Bodies.rectangle(-WALL / 2, h / 2, WALL, h * 8 + WALL, { isStatic: true }),
      Bodies.rectangle(w + WALL / 2, h / 2, WALL, h * 8 + WALL, { isStatic: true })
    ];
    var old = [floor, leftWall, rightWall].filter(Boolean);
    if(old.length) World.remove(world, old);
    World.add(world, next);
    floor = next[0]; leftWall = next[1]; rightWall = next[2];
  }
  resizeBounds();

  var runner = Runner.create();
  Runner.run(runner, engine);

  if(window.ResizeObserver){
    new ResizeObserver(resizeBounds).observe(ground);
  } else {
    window.addEventListener('resize', resizeBounds);
  }

  function dropEntry(text){
    var parts = buildEntryEl(text);
    ground.appendChild(parts.el);

    var margin = ICON / 2 + 4;
    var span = Math.max(w - margin * 2, 1);
    var x = margin + Math.random() * span;
    var y = -ICON - Math.random() * 140;

    var body = Bodies.rectangle(x, y, ICON, ICON, {
      restitution: 0.22,
      friction: 0.55,
      frictionAir: 0.012,
      density: 0.0016,
      chamfer: { radius: 8 },
      angle: Math.random() * 0.6 - 0.3
    });
    Body.setAngularVelocity(body, Math.random() * 0.3 - 0.15);
    Body.setVelocity(body, { x: Math.random() * 1.2 - 0.6, y: 0 });
    World.add(world, body);
    bank.push({ body: body, el: parts.el, img: parts.img });
  }

  function sync(){
    for(var i = 0; i < bank.length; i++){
      var entry = bank[i];
      var pos = entry.body.position;
      entry.el.style.transform = 'translate(' + (pos.x - 32) + 'px,' + (pos.y - ICON / 2) + 'px)';
      entry.img.style.transform = 'rotate(' + entry.body.angle + 'rad)';
    }
    requestAnimationFrame(sync);
  }
  requestAnimationFrame(sync);

  // replay whatever was already dropped here before, falling back in one by one
  stored.forEach(function(text, i){
    setTimeout(function(){ dropEntry(text); }, i * 90);
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var text = input.value.trim();
    if(!text) return;
    dropEntry(text);
    stored.push(text);
    save(stored);
    input.value = '';
    input.focus();
  });
})();
</script>
